  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-colors{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-500{
  transition-duration: 500ms;
}

:root{
  --surface:#0b0b0e;
  --card:rgba(15,15,20,.8);
  --accent:#8b5cf6;
  --ink:#e5e7eb;
  --muted:#9ca3af;
  --soft:#9ca3af
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#0b0b0e;
  color:#e5e7eb;
  font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:500
}

.font-display{
  font-family:"Cinzel","Trajan Pro",serif;
  letter-spacing:.035em
}

.title-glow{
  text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 24px rgba(139,92,246,.34),0 0 38px rgba(59,130,246,.22)
}

.title-sprite{
  background:linear-gradient(92deg,#8b5cf6 0%,#6366f1 52%,#3b82f6 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:none;
  filter:drop-shadow(0 0 14px rgba(139,92,246,.38)) drop-shadow(0 0 22px rgba(59,130,246,.18))
}

.active-accent{
  border-color:rgba(139,92,246,.72)!important;
  color:#a78bfa!important;
  background:linear-gradient(92deg,rgba(139,92,246,.30),rgba(59,130,246,.26))!important;
  box-shadow:0 2px 10px rgba(0,0,0,.45),0 0 0 1px rgba(139,92,246,.24) inset
}

.page-background{
  position:fixed;
  inset:0;
  z-index:0;
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
  pointer-events:none
}

.page-overlay{
  position:fixed;
  inset:0;
  z-index:0;
  background:linear-gradient(rgba(10,10,14,.78),rgba(10,10,14,.84) 55%,rgba(5,5,8,.94));
  pointer-events:none
}

@media (max-width:767px){
  .page-background{
    background-attachment:scroll
  }
}
